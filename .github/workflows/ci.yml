# CI — Rust workspace (desktop Tauri excluded until system WebKit is available in CI)

name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfc-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: nfc-runtime
      - name: Test crates
        run: cargo test --workspace --exclude nfc-desktop
      - name: Smoke example
        run: cargo run -p nfc-runtime --example smoke

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nfc-runtime/apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: nfc-runtime/apps/desktop/package-lock.json
      - name: Install & build
        run: |
          npm ci || npm install
          npm run build

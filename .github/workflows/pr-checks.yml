# Lightweight PR hygiene checks (title, size hints).

name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    steps:
      - name: Validate title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [ -z "${TITLE// }" ]; then
            echo "::error::PR title is empty"
            exit 1
          fi
          if echo "$TITLE" | grep -Pqi '^(wip|tmp|fixme|xxx)\b'; then
            echo "::error::PR title looks like a WIP placeholder. Use a clear title or mark draft."
            exit 1
          fi
          # Discourage AI spam titles
          if echo "$TITLE" | grep -Pqi '^(auto[- ]?pr|generated by|cursor:|copilot:)'; then
            echo "::error::PR title must be human-written (no auto/AI-prefixed titles)."
            exit 1
          fi
          echo "Title OK: $TITLE"

  files:
    name: Diff sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Guard secrets & huge blobs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          CHANGED=$(git diff --name-only "$BASE"..."$HEAD" || true)
          echo "$CHANGED"

          # Block common secret filenames
          if echo "$CHANGED" | grep -Eiq '(^|/)\.env($|\.)|(^|/)id_rsa|(^|/)credentials\.json$|(^|/)secret'; then
            echo "::error::PR touches files that look like secrets. Remove them."
            exit 1
          fi

          # Soft warn on very large new files (>2MB)
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ -f "$f" ] || continue
            size=$(wc -c < "$f" | tr -d ' ')
            if [ "$size" -gt 2097152 ]; then
              echo "::error::File $f is ${size} bytes (>2MB). Keep large assets out of git."
              exit 1
            fi
          done <<< "$(git diff --name-only --diff-filter=A "$BASE"..."$HEAD")"

          echo "Diff sanity OK"

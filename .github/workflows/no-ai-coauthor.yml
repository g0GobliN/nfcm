# Reject commits/PRs that add AI tool co-author trailers or "generated by" markers.

name: No AI co-author

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    name: Scan commit trailers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on AI co-author / generated-by trailers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Patterns that indicate AI tooling claiming authorship via trailers / footers
          PATTERN='(?i)(Co-authored-by:.*(cursor|copilot|chatgpt|gpt-|openai|claude|anthropic|gemini|bard|devin|codeium|tabnine|aider|swe-agent|auto[- ]?gpt|gemini)|Generated-by:.*(cursor|copilot|chatgpt|claude|openai|anthropic|gemini)|Assisted-by:.*(cursor|copilot|chatgpt|claude)|Made-with:\s*Cursor|Signed-off-by:.*noreply\+(cursor|copilot))'

          if [ "$EVENT_NAME" = "pull_request" ]; then
            RANGE="${BASE_SHA}..${HEAD_SHA}"
          else
            # Push to main: check commits in this push
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="$AFTER"
            else
              RANGE="${BEFORE}..${AFTER}"
            fi
          fi

          echo "Scanning commits in range: $RANGE"
          LOG=$(git log --format=full "$RANGE" 2>/dev/null || git log -1 --format=full)

          if echo "$LOG" | grep -Pqi "$PATTERN"; then
            echo "::error::AI co-author / generated-by trailers are not allowed."
            echo ""
            echo "NFCM requires human-attributed commits. Remove trailers such as:"
            echo "  Co-authored-by: Cursor <...>"
            echo "  Co-authored-by: Copilot <...>"
            echo "  Generated-by: ..."
            echo "  Made-with: Cursor"
            echo ""
            echo "Using AI tools to help write code is fine — do not add AI as a co-author."
            echo "See CONTRIBUTING.md → Commit attribution."
            echo ""
            echo "---- matching excerpt ----"
            echo "$LOG" | grep -Pi "$PATTERN" || true
            exit 1
          fi

          echo "OK: no AI co-author trailers found."

[workspace]
resolver = "2"
members = [
    "crates/tensor",
    "crates/hardware",
    "crates/storage",
    "crates/generator",
    "crates/runtime",
    "apps/desktop/src-tauri",
]
default-members = [
    "crates/runtime",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["NFCM Contributors"]
repository = "https://github.com/nfcm/nfc-runtime"

[workspace.dependencies]
nfc-tensor = { path = "crates/tensor" }
nfc-hardware = { path = "crates/hardware" }
nfc-storage = { path = "crates/storage" }
nfc-generator = { path = "crates/generator" }
nfc-runtime = { path = "crates/runtime" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
tempfile = "3"
